### Canonical org terraform-docs config, adapted from the Azure Verified Modules
### reference config (AVM requirement TFNFR2, "Module Documentation Generation").
###
### README.md is fully generated. Edit _header.md or _footer.md, never README.md.
### Regenerate locally with the pinned version (see .pre-commit-config.yaml):
#     docker run --rm -v "$PWD:/w" -w /w \
#       quay.io/terraform-docs/terraform-docs:0.20.0 markdown table -c .terraform-docs.yml .

# Must stay "markdown table". org-terraform-docs passes the formatter as a
# subcommand, and terraform-docs ignores this key whenever a subcommand is
# given, so a mismatch here renders one thing locally and another in CI.
formatter: "markdown table"

# Exact pin, enforced by terraform-docs itself. 0.20.0 is what CI runs (baked
# into terraform-docs/gh-actions v1.4.1). Measured: 0.24.0 pads table delimiter
# rows and 0.20.0 does not, so a range pin that admits 0.24.0 makes local output
# disagree with CI. Use the pinned container locally instead of a range.
version: "0.20.0"

header-from: "_header.md"
footer-from: "_footer.md"

recursive:
  enabled: false
  path: modules

sections:
  hide: []
  show: []

# Section order matches what the fleet renders today. AVM places Modules last;
# copying that would move a section in every repo for no benefit.
#
# The markdownlint pragmas are re-enabled before the footer on purpose, so
# authored prose in _footer.md is still linted. AVM never re-enables and so
# silently exempts its own footer.
content: |-
  <!-- Code generated by terraform-docs. DO NOT EDIT. Edit _header.md or _footer.md. -->
  {{ .Header }}

  <!-- markdownlint-disable MD033 MD034 MD060 -->
  {{ .Requirements }}

  {{ .Providers }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}
  <!-- markdownlint-enable MD033 MD034 MD060 -->

  {{ .Footer }}

output:
  file: README.md
  mode: replace

# Default is "name", which is what every fleet README uses today. AVM overrides
# to "required"; that would reorder every Inputs table.
sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
